server {
    listen 80;
    server_name _;
    limit_req zone=site burst=40 nodelay;
    limit_req_status 429;

    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    location /static/ {
        alias /srv/delivery-static/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name _;
    limit_req zone=site burst=40 nodelay;
    limit_req_status 429;

    ssl_certificate     /etc/nginx/ssl/delivery.pem;
    ssl_certificate_key /etc/nginx/ssl/delivery-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /static/ {
        alias /srv/delivery-static/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# 🧪 IPv6 experiment: the app straight from the internet on [::]:8443 (no ngrok)
server {
    listen [::]:8443 ssl;
    server_name _;
    limit_req zone=site burst=40 nodelay;
    limit_req_status 429;

    ssl_certificate     /etc/nginx/ssl/ipv6.pem;
    ssl_certificate_key /etc/nginx/ssl/ipv6-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /static/ {
        alias /srv/delivery-static/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
