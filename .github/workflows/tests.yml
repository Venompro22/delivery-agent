# Runs the full test suite on every push and pull request.
# Render can be set to deploy only after this check passes.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.2.0
      - name: Run tests
        env:
          GPS_WATCH: "0"
        run: python -m pytest -q
