<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login - Delivery Agent</title>
  <link rel="stylesheet" href="/static/css/auth.css?v={{ asset_v }}"/>
  <link rel="stylesheet" href="/static/vendor/inter/inter.css?v={{ asset_v }}" media="print" onload="this.media='all'"/>
  <link rel="stylesheet" href="/static/pro.css?v={{ asset_v }}"/>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Delivery Agent</h1>
    <div class="sub">Drivers: phone + password · Owner: password only</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="tel" name="phone" placeholder="Phone (drivers)" inputmode="numeric" maxlength="11" autocomplete="username"/>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required/>
    <button type="submit">Log in</button>
    <a class="link" href="/signup">New driver? Create an account</a>
  </form>
  <script src="/static/i18n.js?v={{ asset_v }}"></script>
  <script src="/static/pro.js?v={{ asset_v }}"></script>
</body>
</html>
