<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login - Delivery Agent</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", sans-serif; margin: 0;
      min-height: 100vh; background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      width: 100%; max-width: 360px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 16px; padding: 28px; text-align: center;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    input {
      width: 100%; padding: 12px; margin: 6px 0; font-size: 16px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%; padding: 12px; margin-top: 10px; font-size: 15px; font-weight: 600;
      background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer;
    }
    .error {
      color: var(--danger-text); background: rgba(229,72,77,0.12); border: 1px solid var(--danger);
      border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 10px;
    }
      .link { display: block; margin-top: 16px; font-size: 13px; color: var(--accent-text); text-decoration: none; }
    .ok {
      color: var(--text); background: rgba(31,157,85,0.12); border: 1px solid var(--ok);
      border-radius: 8px; padding: 12px; font-size: 14px; margin-bottom: 6px;
    }
</style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/400.css" media="print" onload="this.media='all'"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/500.css" media="print" onload="this.media='all'"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/600.css" media="print" onload="this.media='all'"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/700.css" media="print" onload="this.media='all'"/>
  <link rel="stylesheet" href="/static/pro.css"/>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Delivery Agent</h1>
    <div class="sub">Drivers: phone + password · Owner: password only</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="tel" name="phone" placeholder="Phone (drivers)" inputmode="numeric" maxlength="11" autocomplete="username"/>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" required/>
    <button type="submit">Log in</button>
    <a class="link" href="/signup">New driver? Create an account</a>
  </form>
  <script src="/static/i18n.js"></script>
  <script src="/static/pro.js"></script>
</body>
</html>
