<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg?v={{ asset_v }}"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Drivers - 智送管家</title>
  <link rel="stylesheet" href="/static/pro.css?v={{ asset_v }}"/>
  <link rel="stylesheet" href="/static/css/drivers.css?v={{ asset_v }}"/>
</head>
<body>
  <div class="wrap">
    <div class="top"><h1>Driver accounts</h1><a class="back" href="/">Dashboard</a></div>
    <div id="list"><div class="empty">Loading…</div></div>
    <h2 class="section">Security log</h2>
    <div id="log"><div class="empty">Loading…</div></div>
    <div class="row danger">
      <div class="who">
        <div class="name">Log out everyone</div>
        <div class="meta">Every phone and computer must log in again.</div>
      </div>
      <button class="block" onclick="logoutAll()">Log out everyone</button>
    </div>
  </div>
  <script>
    const LABEL = {pending: 'Waiting', approved: 'Approved', blocked: 'Blocked'};

    // 🛡️ textContent only: names are typed by strangers, never treat them as HTML (XSS)
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function button(text, cls, id, status) {
      const b = el('button', cls, text);
      b.onclick = async () => {
        if (status === 'blocked' && !confirm('Block this driver? They are logged out right now.')) return;
        await fetch('/api/drivers/' + encodeURIComponent(id) + '/status', {
          method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status})});
        load();
        loadLog();
      };
      return b;
    }

    async function load() {
      const res = await fetch('/api/drivers');
      if (!res.ok) { location.href = '/login'; return; }
      const drivers = await res.json();
      const list = document.getElementById('list');
      list.replaceChildren();
      if (!drivers.length) { list.append(el('div', 'empty', 'No drivers yet.')); return; }
      for (const d of drivers) {
        const row = el('div', 'row');
        const who = el('div', 'who');
        const since = new Date(d.created_at * 1000).toLocaleDateString();
        who.append(el('div', 'name', d.name), el('div', 'meta', d.phone + ' · ' + since));
        row.append(who, el('span', 'badge ' + d.status, LABEL[d.status]));
        if (d.status !== 'approved') row.append(button('Approve', 'approve', d.id, 'approved'));
        if (d.status !== 'blocked') row.append(button('Block', 'block', d.id, 'blocked'));
        if (d.status === 'approved') row.append(resetButton(d));
        list.append(row);
      }
    }
    async function logoutAll() {
      if (!confirm('Log out everyone, including you?')) return;
      await fetch('/api/logout-all', {method: 'POST'});
      location.href = '/login';
    }

    const EVENTS = {
      login: 'Login', login_failed: 'Wrong password', login_blocked: 'Too many tries',
      signup: 'New account', signup_blocked: 'Signup refused',
      approved: 'Approved', blocked: 'Blocked', logout_all: 'Logged out everyone',
      password_changed: 'Password changed', password_change_failed: 'Wrong password',
      password_reset: 'Password reset'};
    const BAD = new Set(['login_failed', 'login_blocked', 'signup_blocked', 'blocked',
                     'password_change_failed']);

    function resetButton(d) {
      const b = el('button', '', 'Reset password');
      b.onclick = async () => {
        if (!confirm('Give ' + d.name + ' a new temporary password?')) return;
        const res = await fetch('/api/drivers/' + encodeURIComponent(d.id) + '/reset-password',
                                {method: 'POST'});
        const data = await res.json();
        if (data.ok) prompt('Send this to ' + d.name + ' on WeChat. They must change it after logging in:',
                            data.password);
        loadLog();
      };
      return b;
    }

    async function loadLog() {
      const res = await fetch('/api/security-log');
      if (!res.ok) return;
      const events = await res.json();
      const box = document.getElementById('log');
      box.replaceChildren();
      if (!events.length) { box.append(el('div', 'empty', 'No events yet.')); return; }
      for (const e of events) {
        const row = el('div', 'log-row' + (BAD.has(e.event) ? ' bad' : ''));
        row.append(
          el('span', 'log-time', new Date(e.at * 1000).toLocaleString()),
          el('span', 'log-event', EVENTS[e.event] || e.event),
          el('span', 'log-who', [e.who, e.detail].filter(Boolean).join(' · ')),
          el('span', 'log-ip', e.ip));
        box.append(row);
      }
    }

    load();
    loadLog();
  </script>
  <script src="/static/i18n.js?v={{ asset_v }}"></script>
  <script src="/static/pro.js?v={{ asset_v }}"></script>
</body>
</html>
