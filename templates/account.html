<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="google" content="notranslate"/>
  <meta charset="utf-8"/>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg?v={{ asset_v }}"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="theme-color" content="#1f5fd6"/>
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="智送管家"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <script src="/static/pwa.js?v={{ asset_v }}" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My account - 智送管家</title>
  <link rel="stylesheet" href="/static/vendor/inter/inter.css?v={{ asset_v }}" media="print"/>
  <link rel="stylesheet" href="/static/pro.css?v={{ asset_v }}"/>
  <link rel="stylesheet" href="/static/css/auth.css?v={{ asset_v }}"/>
  <link rel="stylesheet" href="/static/css/theme.css?v={{ asset_v }}"/>
</head>
<body class="app">
  <form class="card" method="post" action="/account">
    <h1>Change password</h1>
    {% if must_change %}
    <div class="sub">Your password was reset. Choose a new one to continue.</div>
    {% else %}
    <div class="sub">{{ user.name }} · {{ user.phone }}</div>
    {% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if done %}<div class="ok">Password changed</div>{% endif %}
    <input type="password" name="current" placeholder="Current password" autocomplete="current-password" required/>
    <input type="password" name="new" placeholder="New password (8+ characters)" autocomplete="new-password" minlength="8" required/>
    <button type="submit">Save</button>
    {% if not must_change %}<a class="link" href="/driver">Back</a>{% endif %}
  </form>
  <script src="/static/font-load.js?v={{ asset_v }}"></script>
  <script src="/static/i18n.js?v={{ asset_v }}"></script>
  <script src="/static/pro.js?v={{ asset_v }}"></script>
  <script src="/static/app.js?v={{ asset_v }}"></script>
</body>
</html>
