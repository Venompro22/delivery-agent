<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Track your order</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", sans-serif; margin: 0;
      min-height: 100vh; background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 16px; padding: 28px; text-align: center;
    }
    .logo {
      width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 14px;
      background: linear-gradient(135deg, var(--accent), var(--ok));
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
    .big { font-size: 44px; font-weight: 800; color: var(--accent); margin: 6px 0; }
    .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .row { display: flex; gap: 10px; margin-top: 18px; }
    .box { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .box .v { font-size: 20px; font-weight: 700; margin-top: 4px; }
    .done { color: var(--ok); }
    .foot { color: var(--faint); font-size: 11px; margin-top: 20px; }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/400.css" media="print" onload="this.media='all'"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/500.css" media="print" onload="this.media='all'"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/600.css" media="print" onload="this.media='all'"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/700.css" media="print" onload="this.media='all'"/>
  <link rel="stylesheet" href="/static/pro.css"/>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">🚚</div>
    <h1>Loading…</h1>
  </div>
  <script>
    const orderId = {{ order_id|tojson }};
    function esc(t) {
      return String(t).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    async function load() {
      const card = document.getElementById('card');
      try {
        const res = await fetch('/api/track/' + encodeURIComponent(orderId) + '?k=' + encodeURIComponent(new URLSearchParams(location.search).get('k') || ''));
        const d = await res.json();
        if (!d.ok) {
          card.innerHTML = '<div class="logo">❓</div><h1>Order not found</h1>' +
            '<div class="sub">Please check your tracking link.</div>';
          return;
        }
        if (d.status === 'delivered') {
          card.innerHTML = `<div class="logo">✅</div><h1 class="done">Delivered!</h1>
            <div class="sub">Enjoy, ${esc(d.name)} 🎉</div>`;
          return;
        }
        if (d.status === 'cancelled') {
          card.innerHTML = '<div class="logo">⛔</div><h1>Order cancelled</h1>';
          return;
        }
        const before = d.stops_before === 0
          ? "You're next! 🎯"
          : `${d.stops_before} stop${d.stops_before === 1 ? '' : 's'} before you`;
        card.innerHTML = `
          <div class="logo">🚚</div>
          <h1>Hi ${esc(d.name)} 👋</h1>
          <div class="sub">Your order is on the way</div>
          <div class="label">Estimated arrival</div>
          <div class="big">${d.eta}</div>
          <div class="row">
            <div class="box"><div class="label">Position</div><div class="v">#${d.position}</div></div>
            <div class="box"><div class="label">Queue</div><div class="v" style="font-size:14px">${before}</div></div>
          </div>
          ${d.promise ? `<div class="sub" style="margin-top:14px">Promised by ${d.promise}</div>` : ''}
          <div class="foot">Updates automatically · ${new Date().toLocaleTimeString()}</div>`;
      } catch (e) {
        card.innerHTML = '<div class="logo">📡</div><h1>Connection problem</h1>' +
          '<div class="sub">Retrying…</div>';
      }
    }
    load();
    setInterval(load, 15000);
  </script>
  <script src="/static/i18n.js"></script>
  <script src="/static/pro.js"></script>
</body>
</html>
