<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign up - Delivery Agent</title>
  <link rel="stylesheet" href="/static/css/auth.css"/>
  <link rel="stylesheet" href="/static/vendor/inter/inter.css" media="print" onload="this.media='all'"/>
  <link rel="stylesheet" href="/static/pro.css"/>
</head>
<body>
  <form class="card" method="post" action="/signup">
    <h1>Create a driver account</h1>
    {% if done %}
      <div class="ok"><b>Account created!</b><br/>Wait for the owner to approve it, then log in.</div>
      <a class="link" href="/login">Back to login</a>
    {% else %}
      <div class="sub">Your account will be active after the owner approves it.</div>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <input type="text" name="name" placeholder="Full name" maxlength="40" autocomplete="name" required/>
      <input type="tel" name="phone" placeholder="Phone number" inputmode="numeric" maxlength="11" autocomplete="username" required/>
      <input type="password" name="password" placeholder="Password (8+ characters)" minlength="8" autocomplete="new-password" required/>
      <button type="submit">Sign up</button>
      <a class="link" href="/login">Already have an account? Log in</a>
    {% endif %}
  </form>
  <script src="/static/i18n.js"></script>
  <script src="/static/pro.js"></script>
</body>
</html>
