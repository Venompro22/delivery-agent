<html lang="zh-CN">
<head>
  <meta name="google" content="notranslate"/>

<body class="app">
  <div id="sidebar">
    <div class="brand">
      <div class="logo"><svg width="22" height="22" viewBox="17 3 30 52" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"><path d="M32 54s-15-13.5-15-25a15 15 0 1 1 30 0c0 11.5-15 25-15 25z"/><path d="M32 20l2.4 5.1 5.1 2.4-5.1 2.4L32 35l-2.4-5.1-5.1-2.4 5.1-2.4z" fill="#fff" stroke="none"/></svg></div>
      <div>
        <h2>智送管家</h2>
        <div class="subtitle">Smart routing dashboard</div>
      </div>
      <span class="lang-slot" data-lang-slot></span>
      {% include "_menu.html" %}
    </div>

    <nav class="tabs">
      <a href="/orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Orders</span></a>
      <a href="/products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg><span>Products</span></a>
      <a href="/stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Stats</span></a>
      <a href="/drivers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 3.13a4 4 0 0 1 0 7.75M21 21v-2a4 4 0 0 0-3-3.87"/></svg><span>Drivers</span></a>
      <a href="/driver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg><span>Driver view</span></a>

    <div class="gps-row">

    {% if dev_mode %}

      <button class="gps-btn demo-btn" onclick="loadDemo()">✨ Demo</button>

    </div>

        <textarea id="paste" rows="2" placeholder="Paste a WeChat message here…" autocomplete="off"></textarea>
    {% if dev_mode %}
    <div class="chips"><span class="chips-label">Try:</span>
      <button class="chip" onclick="tryMsg(this)">我的水在哪里 13800138001</button>

      <button class="chip" onclick="tryMsg(this)">客户不在家 电话不接 15800158003</button>
      <button class="chip" onclick="tryMsg(this)">我要两桶水 文三路200号 下午5点前</button>
    </div>
    {% endif %}
       <button onclick="handleMessage()">Handle message</button>
    <div id="fb"></div>
    <div id="ai-history"></div>
    <details class="manual-order" id="manual-order">
      <summary>Add order manually</summary>
    <input id="name" placeholder="Customer name" autocomplete="off"/>
    <input id="phone" placeholder="Phone (optional)" inputmode="tel" autocomplete="off"/>
    <input id="note" placeholder="Address / notes (optional) — e.g. Bldg 5, floor 3" maxlength="200" autocomplete="off"/>
    <div class="hint">Tap the map to set the location</div>
    <div class="coords">
      <input id="lat" placeholder="Latitude" inputmode="decimal" autocomplete="off"/>
      <input id="lng" placeholder="Longitude" inputmode="decimal" autocomplete="off"/>
    </div>
    <input id="promise" placeholder="Promise in minutes (optional)" inputmode="numeric" autocomplete="off"/>
    <input id="price" placeholder="Price ¥ (optional)" inputmode="decimal" autocomplete="off"/>
    <button onclick="addOrder()">Add order</button>
    </details>
    <div id="error" class="error"></div>
    <div id="toast" class="toast"></div>
    <a id="req-banner" class="req-banner" href="/orders#requested" hidden></a>

    <div class="stats">
      <div class="stat"><div class="num" id="stat-stops">0</div><div class="label">Stops</div></div>
      <div class="stat"><div class="num" id="stat-km">0</div><div class="label">Km</div></div>
      <div class="stat"><div class="num" id="stat-finish">--</div><div class="label">Finish</div></div>
      <div class="stat done"><div class="num" id="stat-done">0</div><div class="label">Done</div></div>
    </div>

    <h3>Route <span class="live"><span class="dot"></span><span id="updated">live</span></span></h3>
    <div id="stops"></div>
  </div>
  <div id="map"></div>

  <script>
    // 🗺️ map labels follow the page language (中文 / EN)
    let MAP_LANG = 'en';
    try { MAP_LANG = (localStorage.getItem('lang') || ((navigator.language || '').startsWith('zh') ? 'zh' : 'en')) === 'zh' ? 'zh_cn' : 'en'; } catch (e) {}
    // 🌍 The whole world, one copy (no repeating, no empty sides)
    const MAP_BOUNDS = L.latLngBounds([-85, -180], [85, 180]);
    // Same box as wgs2gcj(): inside it the pins are GCJ-02 (Gaode's coordinates)
    const GAODE_BOX = L.latLngBounds([0.8293, 72.004], [55.8271, 137.8347]);
    // Where Gaode is drawn: China and close around (further out Gaode is empty or dark)
    const CHINA_VIEW = L.latLngBounds([18, 73], [54, 135.5]);
    // Gaode only from city-level zoom: zoomed out, Esri everywhere = no visible box
    const GAODE_MIN_ZOOM = 6;
    const map = L.map('map', {
      maxBounds: MAP_BOUNDS,
      maxBoundsViscosity: 1.0,
      minZoom: 4,
      zoomSnap: 0.25,             // smooth zoom in small steps
      zoomDelta: 0.5,
      wheelPxPerZoomLevel: 90,    // softer mouse wheel
    }).setView([30.257, 119.727], 14);   // ZAFU, Lin'an
    // smallest zoom where the world fills the whole screen (depends on the screen size)
    const fitWorld = () => map.setMinZoom(map.getBoundsZoom(MAP_BOUNDS, true));
    fitWorld();
    window.addEventListener('resize', fitWorld);
    // 🍎 Map styles: 🌙 Dark (Apple-like) · ☀️ Light · 🛰️ Satellite — your choice is remembered
    const TILE_SCALE = window.devicePixelRatio > 1 ? 2 : 1;   // retina screens get sharp tiles
    const gaodeUrl = 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=' + MAP_LANG +
      '&size=1&scale=' + TILE_SCALE + '&style=8&x={x}&y={y}&z={z}';
    const tileOpts = {subdomains: ['1', '2', '3', '4'], maxZoom: 18, noWrap: true, attribution: '&copy; AutoNavi'};
    const chinaLayer = cls => L.tileLayer(gaodeUrl,
      Object.assign({className: cls, bounds: CHINA_VIEW, minZoom: GAODE_MIN_ZOOM}, tileOpts));
    // 🌍 Everywhere else: Esri basemaps (no API key needed)
    const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
    const esri = (name, opts) => L.tileLayer(ESRI + name + '/MapServer/tile/{z}/{y}/{x}',
      Object.assign({maxZoom: 18, maxNativeZoom: 16, noWrap: true, attribution: '&copy; Esri'}, opts));

    const mapStyles = {
      'Dim': L.layerGroup([esri('Canvas/World_Dark_Gray_Base'), esri('Canvas/World_Dark_Gray_Reference'),
                    chinaLayer('tiles-dark')]),
      'Light': L.layerGroup([esri('Canvas/World_Light_Gray_Base'), esri('Canvas/World_Light_Gray_Reference'),
                      chinaLayer('tiles-soft')]),
      'Satellite': L.layerGroup([
        // 🌍 the world: Esri imagery + place names.
        // maxNativeZoom must reach maxZoom (18), or the last zoom step is an
        // upscaled z17 tile and the imagery goes soft exactly when you zoom in.
        esri('World_Imagery', {maxNativeZoom: 18}),
        // 🇨🇳 China, close zoom: Gaode imagery (same coordinates as the pins)
        L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
          Object.assign({bounds: CHINA_VIEW, minZoom: GAODE_MIN_ZOOM}, tileOpts)),
        // Gaode satellite street labels (Chinese only). The old English-label
        // layer used mix-blend-mode, which Safari renders wrong and darkened the
        // whole map — Esri's World_Boundaries_and_Places already covers names.
        L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
          {subdomains: ['1', '2', '3', '4'], maxZoom: 18, noWrap: true, bounds: CHINA_VIEW, minZoom: GAODE_MIN_ZOOM}),
        // Last, so the English place names stay readable on top of the opaque
        // Gaode imagery. This overlay is already transparent and needs no blending.
        esri('Reference/World_Boundaries_and_Places', {maxNativeZoom: 18}),
      ]),
    };
    let mapStyle = 'Light';
    try { const saved = localStorage.getItem('mapStyle'); if (mapStyles[saved]) mapStyle = saved; } catch (e) {}
    mapStyles[mapStyle].addTo(map);

    // 🇨🇳 Inside China, Gaode alone: Esri underneath only doubled the tiles and
    // printed a second set of place names on top. Outside China, Esri comes back.
    const isEsri = l => l._url && l._url.indexOf('arcgisonline') !== -1;
    function syncEsri() {
      const inChina = map.getZoom() >= GAODE_MIN_ZOOM && CHINA_VIEW.contains(map.getCenter());
      Object.values(mapStyles).forEach(group => {
        if (!map.hasLayer(group)) return;
        group.eachLayer(l => {
          if (!isEsri(l)) return;
          if (inChina && map.hasLayer(l)) map.removeLayer(l);
          if (!inChina && !map.hasLayer(l)) map.addLayer(l);
        });
      });
    }
    map.on('moveend zoomend', syncEsri);
    map.on('layeradd', () => setTimeout(syncEsri, 0));   // also after a style switch
    syncEsri();
    // 🗺️ Map style switcher: glass buttons with a real preview of each style (tile of Lin'an, z13)
    const PREVIEW = {
      Light: 'https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x=6820&y=3373&z=13',
      Dim: 'https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x=6820&y=3373&z=13',
      Satellite: 'https://webst01.is.autonavi.com/appmaptile?style=6&x=6820&y=3373&z=13',
    };
    const StyleSwitch = L.Control.extend({
      options: {position: 'topleft'},
      onAdd() {
        const box = L.DomUtil.create('div', 'style-switch');
        Object.keys(mapStyles).forEach(name => {
          const b = L.DomUtil.create('button', `style-opt s-${name.toLowerCase()}${name === mapStyle ? ' on' : ''}`, box);
          b.type = 'button';
          b.innerHTML = `<img src="${PREVIEW[name]}" alt=""/><span>${name}</span>`;
          L.DomEvent.on(b, 'click', ev => {
            L.DomEvent.stop(ev);
            if (name === mapStyle) { box.classList.toggle('open'); return; }
            map.removeLayer(mapStyles[mapStyle]);
            mapStyle = name;
            mapStyles[name].addTo(map);
            try { localStorage.setItem('mapStyle', name); } catch (e) {}
            box.querySelectorAll('.style-opt').forEach(x => x.classList.toggle('on', x === b));
            box.classList.remove('open');
          });
        });
        L.DomEvent.disableClickPropagation(box);
        return box;
      },
    });
    new StyleSwitch().addTo(map);
    L.control.scale({imperial: false}).addTo(map);
    let layer = L.layerGroup().addTo(map);
    let pickMarker = null;

    async function api(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) { location.href = '/login'; throw new Error('login required'); }
      return res;
    }
    // Route line: white casing, glowing blue line, light dashes flowing toward the next stop
    function routeLines(path) {
      return [
        L.polyline(path, {color: '#ffffff', weight: 8, opacity: 0.85}),
        L.polyline(path, {color: '#2d6cdf', weight: 4, opacity: 0.95, className: 'route-glow'}),
        L.polyline(path, {color: '#bfdbfe', weight: 3, opacity: 0.9, dashArray: '2 16', lineCap: 'round',
                          className: 'route-flow', interactive: false}),
      ];
    }
    // 🛣️ Real roads: ask our server (OSRM + cache). null = keep the straight line.
    const roadKey = pts => pts.map(p => (+p[0]).toFixed(5) + ',' + (+p[1]).toFixed(5)).join(';');
    async function roadPath(pts) {
      try {
        const d = await (await api('/api/road?pts=' + encodeURIComponent(roadKey(pts)))).json();
        return d.ok && d.road ? d.path : null;
      } catch (e) { return null; }
    }
    // The route lives in its own layer (not cleared every refresh), so it never flickers
    const routeLayer = L.layerGroup().addTo(map);
    let route = null;        // {stops: "key of the stops", path: [...], lines: [...], want: "key we wait for"}
    const roadCache = new Map();
    function setRoute(path) {
      if (!route.lines) { route.lines = routeLines(path); route.lines.forEach(l => l.addTo(routeLayer)); }
      else route.lines.forEach(l => l.setLatLngs(path));
      route.path = path;
    }
    // Cut the road we already know at the truck's position (null if the truck is ~60 m off it)
    function trimPath(path, p) {
      if (!path || path.length < 2) return null;
      let best = -1, bestD = Infinity;
      path.forEach((q, i) => {
        const dd = Math.hypot(q[0] - p[0], (q[1] - p[1]) * Math.cos(p[0] * Math.PI / 180));
        if (dd < bestD) { bestD = dd; best = i; }
      });
      return bestD > 0.0006 ? null : [p, ...path.slice(best + 1)];
    }
    function drawRoute(pts) {
      if (followDriver && pts.length) map.panTo(pts[0], {animate: true});
      if (pts.length < 2) { routeLayer.clearLayers(); route = null; return; }
      const key = roadKey(pts), stops = roadKey(pts.slice(1));
      // Same stops (or the first one just got delivered): keep the road we have, trimmed
      const sameRoad = route && (route.stops === stops || route.stops.endsWith(';' + stops) || route.stops === stops);
      if (sameRoad) {
        const cut = trimPath(route.path, pts[0]);
        if (cut) { route.stops = stops; setRoute(cut); return; }
      } else if (!route || !route.lines) {
        // Nothing drawn yet: straight line until the road is known
        route = {stops, path: null, lines: null, want: key};
        setRoute(roadCache.get(key) || pts);
        if (roadCache.has(key)) return;
      }
      // Stops changed (re-optimised order): keep the old road visible until the new one arrives,
      // never flash back to a straight line
      route.stops = stops;
      route.want = key;
      if (roadCache.has(key)) { setRoute(roadCache.get(key)); return; }
      roadPath(pts).then(path => {
        if (!path) { if (route && route.want === key) setRoute(pts); return; }   // OSRM down: straight line
        if (roadCache.size > 200) roadCache.clear();
        roadCache.set(key, path);
        if (route && route.want === key) setRoute(path);
      });
    }
    // n points spread evenly (by distance) along a path, the last one exactly at its end
    function pointsAlong(path, n) {
      const dist = (a, b) => Math.hypot(a[0] - b[0], (a[1] - b[1]) * Math.cos(a[0] * Math.PI / 180));
      const seg = [];
      let total = 0;
      for (let i = 1; i < path.length; i++) { const len = dist(path[i - 1], path[i]); seg.push(len); total += len; }
      if (!total) return [path[path.length - 1]];
      const out = [];
      for (let k = 1; k <= n; k++) {
        let want = total * k / n, i = 0;
        while (i < seg.length - 1 && want > seg[i]) { want -= seg[i]; i++; }
        const t = seg[i] ? Math.min(1, want / seg[i]) : 1;
        const a = path[i], b = path[i + 1];
        out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
      }
      return out;
    }


    // 🧠 A regular customer: show what the AI remembers, and add the order in one click
    const QTY_RE = /([一二两三四五六七八九十]|\d{1,2})\s*[桶箱瓶件]/;
    function regularNote(g) {
      const place = (g.note || '').replace(QTY_RE, '').trim();
      return `${g.qty ? g.qty + '桶 ' : ''}${place}`.trim();
    }
    function regularCard(g) {
      return `<div class="ai-what ai-regular">
          <span class="reg-badge">常客</span><b>${esc(g.name)}</b> · order #${g.count + 1}
          ${g.usual_place ? `<div class="reg-place">${esc(regularNote(g))}</div>` : ''}
        </div>
        <div class="ai-actions">
          ${g.usual_place ? '<button class="reg-add" onclick="addRegular()">Add order — 1 click</button>' : ''}
          <button onclick="showToast('Tap the map to set the location')">Other place</button>
        </div>`;
    }
    async function addRegular() {
      const g = current.r.regular;
      document.getElementById('name').value = g.name;
      document.getElementById('phone').value = g.phone;
      document.getElementById('note').value = regularNote(g);
      document.getElementById('lat').value = g.lat;
      document.getElementById('lng').value = g.lng;
      document.getElementById('promise').value = '';
      await addOrder();
    }

    // 🎨 Show what the AI understood: each piece of the message gets a coloured highlight
    function highlight(text, ents) {
      let out = '', at = 0;
      (ents || []).forEach(e => {
        if (e.start < at) return;
        out += esc(text.slice(at, e.start)) +
               `<mark class="ent ent-${esc(e.type)}" title="${esc(e.type)}">${esc(text.slice(e.start, e.end))}</mark>`;
        at = e.end;
      });
      return out + esc(text.slice(at));
    }
    // A tidy list of what the AI understood, under the message
    const FACT_LABEL = {name: 'Customer', phone: 'Phone', qty: 'Quantity', product: 'Product',
                        address: 'Address', time: 'When', usual: 'Place'};
    function facts(ents) {
      if (!ents || !ents.length) return '';
      const rows = {};
      ents.forEach(e => { (rows[e.type] = rows[e.type] || []).push(e.text); });
      return '<div class="ai-facts">' + Object.keys(FACT_LABEL).filter(k => rows[k]).map(k =>
        `<span>${FACT_LABEL[k]}</span><b>${esc(rows[k].join(' '))}</b>`).join('') + '</div>';
    }
    const understood = () => (typeof current !== 'undefined' && current && current.r) ? current.r : {};

    // ⚠ Orders at risk of being late: warn the shop before the customer complains
    function apology(name, minutes) {
      return `您好${name}，路上有点堵，预计晚${minutes}分钟左右送到，真的抱歉～`;
    }
    function renderRisk(stops) {
      let box = document.getElementById('risk-card');
      const risky = stops.filter(s => s.promised_epoch && s.eta_epoch)
        .map(s => ({s, margin: Math.round((s.promised_epoch - s.eta_epoch) / 60)}))
        .filter(x => x.margin < 10)
        .sort((a, b) => a.margin - b.margin);
      if (!risky.length) { if (box) box.remove(); return; }
      if (!box) {
        box = document.createElement('div');
        box.id = 'risk-card';
        box.onclick = e => {                                   // one listener for every button
          const b = e.target.closest('button[data-name]');
          if (b) copyText(apology(b.dataset.name, b.dataset.min));
        };
        document.body.appendChild(box);
      }
      box.innerHTML = `<div class="risk-title">${risky.length} order${risky.length > 1 ? 's' : ''} at risk</div>` +
        risky.slice(0, 4).map(({s, margin}) => `
          <div class="risk-row ${margin < 0 ? 'late' : 'tight'}">
            <div><b>${esc(s.name)}</b> · ${margin < 0 ? `about ${-margin} min late` : `only ${margin} min margin`}</div>
            <div class="risk-sub">expected ${esc(s.eta)} · promised ${esc(s.promise)}</div>
            ${margin < 0 ? `<button data-name="${esc(s.name)}" data-min="${-margin}">Copy apology for WeChat</button>` : ''}
          </div>`).join('');
    }

    // 🧭 Map tools: fit every order, follow the truck, live traffic (Gaode, China)
    let followDriver = false;
    const traffic = L.tileLayer('https://tm.amap.com/trafficengine/mapabc/traffictile?v=1.0&t={t}&x={x}&y={y}&z={z}',
      {t: Date.now(), bounds: CHINA_VIEW, minZoom: 10, maxZoom: 18, opacity: 0.85, zIndex: 5});
    setInterval(() => {                         // traffic changes: fresh tiles every 2 minutes
      traffic.options.t = Date.now();
      if (map.hasLayer(traffic)) traffic.redraw();
    }, 120000);
    const ToolBox = L.Control.extend({
      options: {position: 'bottomright'},
      onAdd() {
        const box = L.DomUtil.create('div', 'map-tools');
        const S = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
        const tool = (title, icon, onClick) => {
          const b = L.DomUtil.create('button', 'tool', box);
          b.type = 'button'; b.title = title; b.setAttribute('aria-label', title);
          b.innerHTML = icon;
          L.DomEvent.on(b, 'click', ev => { L.DomEvent.stop(ev); onClick(b); });
        };
        tool('Fit all orders', S('<path d="M3 9V5a2 2 0 0 1 2-2h4M21 9V5a2 2 0 0 0-2-2h-4M3 15v4a2 2 0 0 0 2 2h4M21 15v4a2 2 0 0 1-2 2h-4"/>'), () => {
          const g = L.featureGroup([...layer.getLayers(), ...routeLayer.getLayers()]);
          if (g.getLayers().length) map.fitBounds(g.getBounds(), {padding: [60, 60], maxZoom: 16});
        });
        tool('Follow the driver', S('<polygon points="3 11 22 2 13 21 11 13 3 11"/>'), b => {
          followDriver = !followDriver;

    // at a steady speed. The server only hears about it once a second (for ETAs and the route).
    let simDriving = false;
    function setArrow(target) {
      const el = driverMarker && driverMarker.getElement();
      const arrow = el && el.querySelector('.puck-arrow');
      if (!arrow) return;
      arrowDeg = arrowDeg === null ? target : arrowDeg + ((((target - arrowDeg) % 360) + 540) % 360 - 180);
      arrow.style.transform = `rotate(${arrowDeg}deg)`;
    }
    function driveAlong(path) {
      return new Promise(resolve => {
        const cum = [0];                                        // distance from the start to each point
        for (let i = 1; i < path.length; i++) cum.push(cum[i - 1] + map.distance(path[i - 1], path[i]));
        const total = cum[cum.length - 1] || 1;
        const D = Math.min(12, Math.max(4, total / 150)) * 1000; // 4–12 s per trip, whatever its length
        const t0 = performance.now();
        let seg = 0, lastPost = 0;
        (function frame(now) {
          if (!simRunning) return resolve(false);
          const k = Math.min(1, (now - t0) / D), want = total * k;
          while (seg < cum.length - 2 && cum[seg + 1] < want) seg++;
          const a = path[seg], b = path[seg + 1] || a;
          const t = Math.min(1, (want - cum[seg]) / ((cum[seg + 1] - cum[seg]) || 1));
          const p = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
          driverMarker.setLatLng(p);
          if (b !== a) setArrow(bearing(a, b));                // face along the street we're on
          driverPos = p;
          if (now - lastPost > 1000 || k === 1) {              // tell the server about once a second
            lastPost = now;
            api('/api/driver/location', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                         body: JSON.stringify({lat: p[0], lng: p[1]})}).then(() => refresh());
          }
          if (k < 1) requestAnimationFrame(frame); else resolve(true);
        })(t0);
      });
    }

    function gpsError(err) {
      if (!window.isSecureContext) {

    // 📍 Phones give GPS in WGS-84; Chinese maps (Gaode) use GCJ-02 → convert, or the dot is ~500 m off
    function wgs2gcj(lat, lng) {
      if (lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271) return [lat, lng];  // outside China
      const a = 6378245.0, ee = 0.00669342162296594323, PI = Math.PI;
      const x = lng - 105.0, y = lat - 35.0;
      let dLat = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      dLat += (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3;
      dLat += (20 * Math.sin(y * PI) + 40 * Math.sin(y / 3 * PI)) * 2 / 3;
      dLat += (160 * Math.sin(y / 12 * PI) + 320 * Math.sin(y * PI / 30)) * 2 / 3;
      let dLng = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      dLng += (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3;
      dLng += (20 * Math.sin(x * PI) + 40 * Math.sin(x / 3 * PI)) * 2 / 3;
      dLng += (150 * Math.sin(x / 12 * PI) + 300 * Math.sin(x / 30 * PI)) * 2 / 3;
      const rad = lat / 180 * PI;
      let m = Math.sin(rad); m = 1 - ee * m * m;
      const sm = Math.sqrt(m);
      dLat = (dLat * 180) / ((a * (1 - ee)) / (m * sm) * PI);
      dLng = (dLng * 180) / (a / sm * Math.cos(rad) * PI);
      return [lat + dLat, lng + dLng];
    }

    async function sendLocation(pos) {
      const [lat, lng] = wgs2gcj(pos.coords.latitude, pos.coords.longitude);
      const acc = Math.round(pos.coords.accuracy);
      const res = await api('/api/driver/location', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({lat, lng}),
      });
      if (!res.ok) { gpsStatus('Server rejected the location.'); return; }
      lastSent = Date.now();
      gpsStatus(`You are here (±${acc} m) · ${new Date().toLocaleTimeString()}`);
      lastStopCount = -1;
      refresh();
    }

    function locateOnce() {
      if (!navigator.geolocation || !window.isSecureContext) { gpsError(); return; }

        {enableHighAccuracy: true, timeout: 15000, maximumAge: 0});
    }

        btn.textContent = 'Live GPS: off';
        gpsStatus('Live GPS stopped.');
        return;

      if (!navigator.geolocation || !window.isSecureContext) { gpsError(); return; }
      btn.classList.add('on');
      btn.textContent = 'Live GPS: on';
      gpsStatus('Starting live GPS…');
      watchId = navigator.geolocation.watchPosition(pos => {
        if (Date.now() - lastSent > 20000) sendLocation(pos);
      }, gpsError, {enableHighAccuracy: true, maximumAge: 10000});
    }

    }

    async function assign(id, driverId) {
      await fetch('/api/orders/' + encodeURIComponent(id) + '/assign', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({driver_id: driverId || null})});
    }

    async function share(id, key) {
      const url = `${location.origin}/track/${id}?k=${key}`;
      try {
        await navigator.clipboard.writeText(url);
        alert('Tracking link copied ' + url);
      } catch (e) {
        prompt('Copy this tracking link for the customer:', url);
      }
    }

    function navUrl(s) {
      const name = encodeURIComponent(s.name);
      return `https://uri.amap.com/navigation?to=${s.lng},${s.lat},${name}&mode=car&callnative=1`;
    }

    async function deliver(id) {
      await api(`/api/orders/${id}/deliver`, {method: 'POST'});
      refresh();
    }

    // ---------- 🔔 Alerts: new orders + late orders ----------
    let alertsReady = false;
    const knownIds = new Set();
    const lateSeen = new Set();
    let audioCtx = null;

    // Browsers only allow sound/notifications after the user clicks once
    document.addEventListener('click', () => {
      try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
    }, {once: true});

    function beep(freq, ms) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.value = 0.15;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + ms / 1000);
    }

    function notify(msg) {
      showToast(msg);
      if (window.Notification && Notification.permission === 'granted') {
        new Notification('智送管家', {body: msg});
      }
    }

    function checkAlerts(stops) {
      const newOnes = stops.filter(s => !knownIds.has(s.id));
      const lateNow = stops.filter(s => s.late && !lateSeen.has(s.id));
      stops.forEach(s => knownIds.add(s.id));
      lateNow.forEach(s => lateSeen.add(s.id));
      if (!alertsReady) { alertsReady = true; return; }   // first load: stay quiet
      if (lateNow.length) {
        beep(440, 400);
        notify(`LATE: ${lateNow.map(s => s.name).join(', ')}`);
      } else if (newOnes.length) {
        beep(880, 150);
        notify(`New order: ${newOnes.map(s => s.name).join(', ')}`);
      }
    }

    // ---------- 🧭 Driver puck: smooth movement + heading arrow ----------
    const PUCK = '<div class="puck"><div class="puck-ring"></div>' +
      '<svg class="puck-arrow" viewBox="0 0 40 40" width="40" height="40">' +
      '<defs><linearGradient id="puckGrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#4f8dff"/><stop offset="1" stop-color="#1f5fd6"/></linearGradient></defs>' +
      '<circle cx="20" cy="20" r="15" fill="url(#puckGrad)" stroke="#fff" stroke-width="3"/>' +
      '<path d="M20 10 L27 27 L20 23 L13 27 Z" fill="#fff"/></svg></div>';
    let driverMarker = null, driverPos = null;

    function bearing(a, b) {
      const r = x => x * Math.PI / 180;
      const y = Math.sin(r(b[1] - a[1])) * Math.cos(r(b[0]));
      const x = Math.cos(r(a[0])) * Math.sin(r(b[0])) - Math.sin(r(a[0])) * Math.cos(r(b[0])) * Math.cos(r(b[1] - a[1]));
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    let glideId = 0, arrowDeg = null;
    function updateDriver(lat, lng) {
      const to = [lat, lng];
      if (!driverMarker) {
        driverMarker = L.marker(to, {icon: L.divIcon({className: '', html: PUCK, iconSize: [40, 40],
          iconAnchor: [20, 20]}), zIndexOffset: 1000}).addTo(map).bindPopup('Driver');
        driverPos = to;
        return;
      }
      if (driverPos[0] === lat && driverPos[1] === lng) return;
      if (simDriving) return;                                   // the simulator moves the arrow itself
      const cur = driverMarker.getLatLng();
      const from = [cur.lat, cur.lng];                          // start from where the arrow really is now
      if (map.distance(from, to) > 3) {                         // turn the arrow toward where we are going
        const arrow = driverMarker.getElement() && driverMarker.getElement().querySelector('.puck-arrow');
        if (arrow) {
          const target = bearing(from, to);
          // the short way round: 350° → 10° is +20°, not a full turn back
          arrowDeg = arrowDeg === null ? target : arrowDeg + ((((target - arrowDeg) % 360) + 540) % 360 - 180);
          arrow.style.transform = `rotate(${arrowDeg}deg)`;
        }
      }
      const id = ++glideId, t0 = performance.now(), D = 550;   // one glide at a time: a new one cancels the old
      (function step(now) {
        if (id !== glideId) return;
        const k = Math.min(1, (now - t0) / D);
        const e = 1 - Math.pow(1 - k, 3);                        // ease-out: smooth stop, no overshoot
        driverMarker.setLatLng([from[0] + (to[0] - from[0]) * e, from[1] + (to[1] - from[1]) * e]);
        if (k < 1) requestAnimationFrame(step);
      })(t0);
      driverPos = to;
    }

    const driversLayer = L.layerGroup().addTo(map);
    const driverPins = {};                       // driver id → its marker

    function drawDrivers(list) {
      const seen = new Set();
      for (const d of list) {
        seen.add(d.id);
        const fresh = d.age < 300;               // GPS older than 5 minutes = grey
        const icon = L.divIcon({className: '', iconSize: null,
          html: `<div class="driver-pin${fresh ? '' : ' stale'}">${esc(d.name)}</div>`});
        const tip = esc(d.name) + ' — ' + (fresh ? 'live' : Math.round(d.age / 60) + ' min ago');
        if (driverPins[d.id]) {
          driverPins[d.id].setLatLng([d.lat, d.lng]).setIcon(icon).setTooltipContent(tip);
        } else {
          driverPins[d.id] = L.marker([d.lat, d.lng], {icon, zIndexOffset: 1000})
            .bindTooltip(tip).addTo(driversLayer);
        }
      }
      for (const id of Object.keys(driverPins)) {          // drivers that disappeared
        if (!seen.has(id)) { driversLayer.removeLayer(driverPins[id]); delete driverPins[id]; }
      }
    }

    let refreshSeq = 0;
    async function refresh() {
      const seq = ++refreshSeq;
      const res = await api('/api/route');
      const data = await res.json();
      if (seq !== refreshSeq) return;        // a newer refresh started meanwhile: ignore this older answer
      drawDrivers(data.drivers || []);       // before the check below: drivers move even when orders don't

      // Same data as last time? Only update the clock — no redraw, no flicker.
      const signature = JSON.stringify([data.driver, data.summary, data.stops]);
      const stamp = 'updated ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
      if (signature === lastSignature) {
        document.getElementById('updated').textContent = stamp;
        return;
      }
      lastSignature = signature;

      checkAlerts(data.stops);
      layer.clearLayers();
      const pts = [[data.driver.lat, data.driver.lng]];
      updateDriver(data.driver.lat, data.driver.lng);

      let html = '';
      data.stops.forEach(s => {
        pts.push([s.lat, s.lng]);
        const color = s.late ? '#e5484d' : '#2d6cdf';
        L.marker([s.lat, s.lng], {icon: L.divIcon({className: '',
          html: `<div class="pin${s.sequence === 1 ? ' next' : ''}${s.late ? ' late' : ''}" style="background:${color}">${s.sequence}</div>`,
          iconSize: [28, 28], iconAnchor: [14, 14]})})
          .addTo(layer).bindPopup(`${s.sequence}. ${esc(s.name)} — ETA ${s.eta}`);

        let cls = 'stop';
        if (!seenIds.has(s.id)) { cls += ' new'; seenIds.add(s.id); }
        if (s.sequence === 1) cls += ' next';
        if (s.late) cls += ' late';
        const badge = s.late ? '<span class="badge">LATE</span>' : '';
        const promise = s.promise
          ? ` &middot; <span class="promise">promised ${s.promise}</span>` : '';
        html += `<div class="${cls}" data-id="${s.id}">
          <b>${s.sequence}. ${esc(s.name)}</b>${badge}
          <div class="meta">ETA ${s.eta} &middot; +${s.leg_km} km${promise}</div>
          ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}
          <div class="actions">
            <a class="nav" href="${navUrl(s)}" target="_blank" rel="noopener">${ICON.nav}Navigate</a>
            ${s.phone ? `<a class="nav call" href="tel:${s.phone}">${ICON.phone}Call</a>` : ''}
            <button class="share" onclick="share('${s.id}', '${s.track_key}')">${ICON.share}Share</button>${driverSelect(s)}
            <button onclick="deliver('${s.id}')">✓ Delivered</button>
          </div>
        </div>`;
      });

      const nReq = data.summary.requested_count || 0, reqBanner = document.getElementById('req-banner');
      reqBanner.hidden = !nReq;
      reqBanner.textContent = nReq === 1 ? '1 customer order waiting — review' : `${nReq} customer orders waiting — review`;
      document.getElementById('stat-stops').textContent = data.summary.stops;
      document.getElementById('stat-km').textContent = data.summary.total_km;
      document.getElementById('stat-finish').textContent = data.summary.finish;
      document.getElementById('stat-done').textContent = data.summary.delivered;
      document.getElementById('stops').innerHTML = html ||
        '<div class="empty">No orders yet.<br>Tap the map to add one</div>';

      if (pts.length > 1) {
        drawRoute(pts);
        renderRisk(data.stops);
        if (data.stops.length !== lastStopCount) {
          map.fitBounds(pts, {padding: [40, 40]});
        }
      }
      lastStopCount = data.stops.length;
      document.getElementById('updated').textContent =
        'updated ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
    }

    refresh();
    setInterval(() => { if (!document.hidden) refresh(); }, 10000);
    if (window.isSecureContext && navigator.permissions) {
      navigator.permissions.query({name: 'geolocation'})
        .then(p => { if (p.state === 'granted') locateOnce(); })
        .catch(() => {});
    }
  </script>
  <script src="/static/i18n.js?v={{ asset_v }}"></script>
  <script src="/static/pro.js?v={{ asset_v }}"></script>
  <script src="/static/app.js?v={{ asset_v }}"></script>
</body>
</html>
