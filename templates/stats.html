<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg?v={{ asset_v }}"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Stats - 智送管家</title>
  <script src="/static/vendor/chart.umd.min.js?v={{ asset_v }}"></script>
  <link rel="stylesheet" href="/static/css/stats.css?v={{ asset_v }}"/>
  <link rel="stylesheet" href="/static/vendor/inter/inter.css?v={{ asset_v }}" media="print" onload="this.media='all'"/>
  <link rel="stylesheet" href="/static/pro.css?v={{ asset_v }}"/>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Stats</h1>
      <span class="lang-slot" data-lang-slot></span>
      <a class="back" href="/">← Dashboard</a>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="l">This week</div><div class="n" id="k-week">–</div><div class="s">orders delivered</div></div>
      <div class="kpi"><div class="l">Today</div><div class="n" id="k-today">–</div><div class="s">orders delivered</div></div>
      <div class="kpi"><div class="l">Median time</div><div class="n" id="k-time">–</div><div class="s">minutes per order</div></div>
      <div class="kpi"><div class="l">On time</div><div class="n" id="k-ontime">–</div><div class="s">of promised orders</div></div>
    </div>

    <div class="charts">
      <div class="chart"><h3>Deliveries — last 7 days</h3><div class="chart-box"><canvas id="chart-days"></canvas></div></div>
      <div class="chart"><h3>Busiest hours</h3><div class="chart-box"><canvas id="chart-hours"></canvas></div></div>
    </div>
  </div>

  <script>
    function baseOptions() {
      return {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false } },
          y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: 'rgba(255,255,255,0.06)' } },
        },
      };
    }

    async function load() {
      const res = await fetch('/api/stats');
      if (res.status === 401) { location.href = '/login'; return; }
      const d = await res.json();

      const week = d.delivered.reduce((a, b) => a + b, 0);
      const today = d.delivered[d.delivered.length - 1];
      document.getElementById('k-week').textContent = week;
      document.getElementById('k-today').textContent = today;
      document.getElementById('k-time').textContent = d.avg_minutes ?? '–';
      document.getElementById('k-ontime').textContent = d.on_time_pct !== null ? d.on_time_pct + '%' : '–';

      Chart.defaults.color = '#8a8f98';
      Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;

      new Chart(document.getElementById('chart-days'), {
        type: 'bar',
        data: {
          labels: d.days,
          datasets: [{ data: d.delivered, backgroundColor: '#2d6cdf', borderRadius: 6, maxBarThickness: 34 }],
        },
        options: baseOptions(),
      });

      const busiest = Math.max(...d.by_hour);
      new Chart(document.getElementById('chart-hours'), {
        type: 'bar',
        data: {
          labels: d.by_hour.map((_, h) => h + 'h'),
          datasets: [{
            data: d.by_hour,
            backgroundColor: d.by_hour.map(v => v === busiest && v > 0 ? '#f0a020' : '#1f9d55'),
            borderRadius: 4,
          }],
        },
        options: baseOptions(),
      });
    }

    load();
  </script>
  <div class="wrap-drivers">
    <h2 class="section">Drivers — last 7 days</h2>
    <div id="driver-stats"></div>
  </div>
  <script>
    (async () => {
      const res = await fetch('/api/stats');
      if (!res.ok) return;
      const {drivers} = await res.json();
      const box = document.getElementById('driver-stats');
      if (!drivers || !drivers.length) { box.textContent = 'No deliveries yet.'; return; }
      const table = document.createElement('table');
      table.className = 'driver-table';
      const head = table.createTHead().insertRow();
      for (const h of ['Driver', 'Today', '7 days', 'Median time', 'On time', 'Late']) {
        const th = document.createElement('th');
        th.textContent = h;
        head.append(th);
      }
      const body = table.createTBody();
      for (const d of drivers) {
        const row = body.insertRow();
        for (const v of [d.name, d.today, d.week,
                         d.median_minutes == null ? '--' : d.median_minutes + ' min',
                         d.on_time_pct == null ? '--' : d.on_time_pct + '%', d.late]) {
          row.insertCell().textContent = v;
        }
        if (d.late) row.lastChild.className = 'bad';
      }
      box.append(table);
    })();
  </script>
  <script src="/static/i18n.js?v={{ asset_v }}"></script>
  <script src="/static/pro.js?v={{ asset_v }}"></script>
</body>
</html>
