<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="google" content="notranslate"/>
  <meta charset="utf-8"/>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg?v={{ asset_v }}"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Stats - 智送管家</title>
  <script src="/static/font-load.js?v={{ asset_v }}"></script>
  <script src="/static/vendor/chart.umd.min.js?v={{ asset_v }}"></script>
  <link rel="stylesheet" href="/static/css/stats.css?v={{ asset_v }}"/>
  <link rel="stylesheet" href="/static/vendor/inter/inter.css?v={{ asset_v }}" media="print"/>
  <link rel="stylesheet" href="/static/pro.css?v={{ asset_v }}"/>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Stats</h1>
      <span class="lang-slot" data-lang-slot></span>
      <a class="back" href="/">← Dashboard</a>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="l">This week</div><div class="n" id="k-week">–</div><div class="s">orders delivered</div></div>
      <div class="kpi"><div class="l">Today</div><div class="n" id="k-today">–</div><div class="s">orders delivered</div></div>
      <div class="kpi"><div class="l">Median time</div><div class="n" id="k-time">–</div><div class="s">minutes per order</div></div>
      <div class="kpi"><div class="l">On time</div><div class="n" id="k-ontime">–</div><div class="s">of promised orders</div></div>
    </div>

    <div class="charts">
      <div class="chart"><h3>Deliveries — last 7 days</h3><div class="chart-box"><canvas id="chart-days"></canvas></div></div>
      <div class="chart"><h3>Busiest hours</h3><div class="chart-box"><canvas id="chart-hours"></canvas></div></div>
    </div>
  </div>

  <div class="wrap-drivers">
    <h2 class="section">Drivers — last 7 days</h2>
    <div id="driver-stats"></div>
  </div>
  <script src="/static/stats.js?v={{ asset_v }}"></script>
  <script src="/static/i18n.js?v={{ asset_v }}"></script>
  <script src="/static/pro.js?v={{ asset_v }}"></script>
</body>
</html>
