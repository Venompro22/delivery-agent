<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="google" content="notranslate"/>
  <meta charset="utf-8"/>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg?v={{ asset_v }}"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="theme-color" content="#0b1220"/>
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="智送管家"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <script src="/static/pwa.js?v={{ asset_v }}" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>我的订单 · 智送管家</title>
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css?v={{ asset_v }}"/>
  <link rel="stylesheet" href="/static/css/me-pro.css?v={{ asset_v }}"/>
</head>
<body>
  <div id="map"></div>

  <header class="mp-top">
    <div class="mp-brand"><img src="/static/logo.svg?v={{ asset_v }}" alt=""/><span>智送管家</span></div>
    <div class="mp-actions">
      <button id="lang" class="mp-chip" type="button"></button>
      <form method="post" action="/logout"><button class="mp-chip" type="submit" id="t-out"></button></form>
    </div>
  </header>

  <div class="mp-fabs">
    <button id="focus" class="mp-fab" type="button" aria-label="Focus"><svg viewBox="0 0 24 24"><path d="M3 9V5a2 2 0 0 1 2-2h4M21 9V5a2 2 0 0 0-2-2h-4M3 15v4a2 2 0 0 0 2 2h4M21 15v4a2 2 0 0 1-2 2h-4"/></svg></button>
    <button id="locate" class="mp-fab" type="button" aria-label="My location"><svg viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></button>
  </div>

  <section class="mp-sheet">
    <div class="mp-grip"></div>
    <h1 id="hello"></h1>
    <div id="live"></div>

    <div class="mp-card" id="shop" hidden>
      <h2 id="t-shop"></h2>
      <div class="mp-claim">
        <input id="ai-text" class="mp-input" maxlength="300" autocomplete="off"/>
        <button id="ai-read" class="mp-btn" type="button"></button>
      </div>
      <div class="mp-msg" id="ai-msg"></div>
      <div id="menu" class="mp-menu"></div>
      <p class="mp-hint" id="t-where"></p>
      <input id="addr" class="mp-input" maxlength="120" autocomplete="off"/>
      <div class="mp-fee" id="fee-line"></div>
      <div class="mp-total"><span id="total"></span><button id="place" class="mp-btn" type="button"></button></div>
      <div class="mp-msg" id="order-msg"></div>
    </div>

    <div class="mp-card">
      <h2 id="t-orders"></h2>
      <div id="orders" class="mp-list"></div>
    </div>

    <details class="mp-card mp-more">
      <summary id="t-add"></summary>
      <div class="mp-claim">
        <input id="link" class="mp-input" placeholder="https://.../track/..." autocomplete="off"/>
        <button id="claim" class="mp-btn" type="button"></button>
      </div>
      <div class="mp-msg" id="msg"></div>
    </details>
  </section>

  <script src="/static/vendor/leaflet/leaflet.js?v={{ asset_v }}"></script>
  <script>
    const NAME = {{ name|tojson }};
    let lang = 'zh';
    try { lang = localStorage.getItem('lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en'); } catch (e) {}
    const TEXTS = {
      en: { hello: n => `Hi, ${n}`, out: 'Log out', orders: 'My orders', add: 'Add an order with its tracking link', btn: 'Add',
            empty: 'No past orders yet.', added: 'Order added', bad: 'This tracking link is not valid',
            shop: 'Order now', where: 'Tap the map to set where we deliver, then add your building and room.',
            addr: 'Building, floor, room (e.g. Bldg 5, room 302)', place: 'Place order', total: n => `Total ¥${n}`,
            needItems: 'Choose at least one product', needPin: 'Tap the map to set the delivery spot',
            needAddr: 'Add your building and room', placed: 'Order sent! The shop will confirm it soon.',
            cancel: 'Cancel', cancelAsk: 'Cancel this order?', here: 'Deliver here',
            again: 'Order again', againGone: 'Some products are not sold any more',
            fee: n => `Delivery ¥${n}`, feeFree: 'Free delivery', freeOver: n => `free over ¥${n}`, minOrder: n => `Minimum order ¥${n}`,
            waiting: 'Waiting for the shop to confirm', onWay: 'On the way', eta: 'Arriving around',
            next: 'You are next: the driver is heading to you', before: n => `${n} stop${n === 1 ? '' : 's'} before you`,
            arrived: 'Your driver is here! Please come down', arrivedShort: 'Here!', soon: 'Any moment', mins: m => `${m} min`,
            track: 'Track', me: 'You are here', other: '中文',
            lastSeen: m => `Driver last seen ${m} min ago`, route: "Driver's route", noRoute: 'No route was recorded for this order',
            aiPh: 'Or just type it: 2 water to bldg 5 room 302', aiBtn: 'Read',
            aiGot: list => `Understood: ${list}. Check the cart below, then press Place order.`,
            aiNone: 'Sorry, I could not find these products. Pick them below.', aiSkip: t => ` Not found: ${t}.`,
            st: { requested: 'Waiting', pending: 'On the way', delivered: 'Delivered', cancelled: 'Cancelled' } },
      zh: { hello: n => `你好，${n}`, out: '退出', orders: '我的订单', add: '用追踪链接添加订单', btn: '添加',
            empty: '还没有历史订单～', added: '订单已添加', bad: '追踪链接无效',
            shop: '立即下单', where: '在地图上点一下送货位置，再填楼号和房间号～',
            addr: '楼号、楼层、房间（如 5号楼302）', place: '下单', total: n => `合计 ¥${n}`,
            needItems: '先选一件商品吧', needPin: '在地图上点一下送货位置', needAddr: '填一下楼号和房间号',
            placed: '下单成功！商家确认后马上配送～', cancel: '取消', cancelAsk: '确定取消这个订单吗？', here: '送到这里',
            again: '再来一单', againGone: '有些商品已下架啦',
            fee: n => `配送费 ¥${n}`, feeFree: '免配送费', freeOver: n => `满¥${n}免配送费`, minOrder: n => `起送价 ¥${n}`,
            waiting: '等商家确认中', onWay: '配送中', eta: '预计送达',
            next: '下一站就是你，骑手正在赶来', before: n => `前面还有 ${n} 站`,
            arrived: '司机到啦，下楼取一下～', arrivedShort: '到啦！', soon: '马上到', mins: m => `${m} 分钟`,
            track: '查看进度', me: '你在这', other: 'EN',
            lastSeen: m => `司机位置 ${m} 分钟前更新`, route: '配送路线', noRoute: '这个订单没有记录配送路线',
            aiPh: '或者直接打字：两桶水送到5号楼302', aiBtn: '识别',
            aiGot: list => `识别到：${list}。请核对下面的购物车，再点下单。`,
            aiNone: '没找到这些商品，请在下面选择～', aiSkip: t => ` 没找到：${t}。`,
            st: { requested: '等商家确认', pending: '配送中', delivered: '已送达', cancelled: '已取消' } },
    };
    const T = TEXTS[lang === 'en' ? 'en' : 'zh'];

    const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const yuan = n => Number.isInteger(n) ? String(n) : n.toFixed(2);
    const $ = id => document.getElementById(id);

    $('hello').textContent = T.hello(NAME);
    $('t-out').textContent = T.out;
    $('t-orders').textContent = T.orders;
    $('t-add').textContent = T.add;
    $('claim').textContent = T.btn;
    $('t-shop').textContent = T.shop;
    $('t-where').textContent = T.where;
    $('addr').placeholder = T.addr;
    $('place').textContent = T.place;
    $('ai-text').placeholder = T.aiPh;
    $('ai-read').textContent = T.aiBtn;
    $('lang').textContent = T.other;
    $('lang').onclick = () => { try { localStorage.setItem('lang', lang === 'en' ? 'zh' : 'en'); } catch (e) {} location.reload(); };
    try { $('addr').value = localStorage.getItem('lastAddress') || ''; } catch (e) {}

    // ---------- Map: Esri underneath everywhere, Gaode (complete Chinese map) on top in China ----------
    const CHINA = L.latLngBounds([18, 73], [54, 135.5]);
    const map = L.map('map', { zoomControl: false, attributionControl: false, zoomSnap: 0.25 }).setView([30.257, 119.727], 14);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
                { maxZoom: 18, maxNativeZoom: 16 }).addTo(map);
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=2&style=8&x={x}&y={y}&z={z}',
                { subdomains: '1234', maxZoom: 18, bounds: CHINA, minZoom: 6 }).addTo(map);
    let userMoved = false;
    map.on('dragstart', () => { userMoved = true; });

    // ---------- You are here (phones give WGS-84; Chinese maps use GCJ-02) ----------
    const PI = Math.PI;
    function outOfChina(lat, lng) { return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271; }
    function tLat(x, y) {
      let r = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      r += (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3;
      r += (20 * Math.sin(y * PI) + 40 * Math.sin(y / 3 * PI)) * 2 / 3;
      r += (160 * Math.sin(y / 12 * PI) + 320 * Math.sin(y * PI / 30)) * 2 / 3;
      return r;
    }
    function tLng(x, y) {
      let r = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      r += (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3;
      r += (20 * Math.sin(x * PI) + 40 * Math.sin(x / 3 * PI)) * 2 / 3;
      r += (150 * Math.sin(x / 12 * PI) + 300 * Math.sin(x / 30 * PI)) * 2 / 3;
      return r;
    }
    function wgs2gcj(lat, lng) {
      if (outOfChina(lat, lng)) return [lat, lng];
      const a = 6378245.0, ee = 0.00669342162296594323;
      let dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
      const rad = lat / 180 * PI;
      let m = Math.sin(rad); m = 1 - ee * m * m;
      const s = Math.sqrt(m);
      dLat = (dLat * 180) / ((a * (1 - ee)) / (m * s) * PI);
      dLng = (dLng * 180) / (a / s * Math.cos(rad) * PI);
      return [lat + dLat, lng + dLng];
    }
    let meDot = null, meRing = null, myPos = null, pastLn = null, pastHome = null;
    function showMe(lat, lng, acc) {
      myPos = [lat, lng];
      if (!meDot) {
        meRing = L.circle(myPos, { radius: acc, color: '#3b82f6', weight: 1, fillOpacity: 0.12, interactive: false }).addTo(map);
        meDot = L.circleMarker(myPos, { radius: 8, color: '#fff', weight: 3, fillColor: '#3b82f6', fillOpacity: 1 }).addTo(map).bindTooltip(T.me);
      } else { meDot.setLatLng(myPos); meRing.setLatLng(myPos).setRadius(acc); }
    }
    function locate(fly) {
      if (!navigator.geolocation || !window.isSecureContext) return;
      navigator.geolocation.getCurrentPosition(p => {
        const [lat, lng] = wgs2gcj(p.coords.latitude, p.coords.longitude);
        showMe(lat, lng, Math.round(p.coords.accuracy));
        if (!pin && !$('shop').hidden) setPin(lat, lng);
        if (fly || !activeOrder) map.flyTo([lat, lng], 16, { duration: 1 });
      }, () => {}, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
    }
    $('locate').onclick = () => { userMoved = true; locate(true); };
    $('focus').onclick = () => {
      userMoved = false; lastFrame = '';
      [pastLn, pastHome].forEach(l => { if (l) map.removeLayer(l); });   // back from a history route
      pastLn = pastHome = null;
      loadLive();
    };
    try {
      navigator.permissions.query({ name: 'geolocation' }).then(p => { if (p.state === 'granted') locate(false); }).catch(() => {});
    } catch (e) {}

    // ---------- Live: the order on its way, the driver moving, the road once you are next ----------
    let activeOrder = null, driverMk = null, homeMk = null, roadLn = null, trailLn = null, lastFrame = '';
    let carHeading = null;
    function bearing(a, b) {
      const r = x => x * Math.PI / 180;
      const y = Math.sin(r(b[1] - a[1])) * Math.cos(r(b[0]));
      const x = Math.cos(r(a[0])) * Math.sin(r(b[0])) - Math.sin(r(a[0])) * Math.cos(r(b[0])) * Math.cos(r(b[1] - a[1]));
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }
    function turnCar(from, to) {
      if (map.distance(from, to) > 3) carHeading = bearing([from.lat, from.lng], to);   // ignore GPS jitter
      const arrow = driverMk && driverMk.getElement() && driverMk.getElement().querySelector('.mp-car-arrow');
      if (arrow && carHeading !== null) arrow.style.transform = `rotate(${carHeading}deg)`;
    }
    function glide(marker, to) {
      const from = marker.getLatLng(), t0 = performance.now();
      (function step(now) {
        const k = Math.min(1, (now - t0) / 800), e = 1 - Math.pow(1 - k, 3);
        marker.setLatLng([from.lat + (to[0] - from.lat) * e, from.lng + (to[1] - from.lng) * e]);
        if (k < 1) requestAnimationFrame(step);
      })(t0);
    }
    function clearDriver() {
      [driverMk, roadLn, trailLn].forEach(l => { if (l) map.removeLayer(l); });
      driverMk = roadLn = trailLn = null;
      carHeading = null;
    }
    function clearLive() {
      clearDriver();
      if (homeMk) map.removeLayer(homeMk);
      homeMk = null;
    }
    function drawLive(o) {
      activeOrder = o;
      if (!o) { clearLive(); return; }
      const dest = [o.lat, o.lng], drv = o.driver;
      if (!homeMk) homeMk = L.marker(dest, { icon: L.divIcon({ className: '', html: '<div class="mp-home"></div>', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(map);
      else homeMk.setLatLng(dest);
      if (!drv) {                       // not next yet (or still at the last door): the server sends no driver
        clearDriver();
        const frame = 'h' + o.id;
        if (!userMoved && frame !== lastFrame) { lastFrame = frame; map.setView(dest, 16); }
        return;
      }
      if (!driverMk) driverMk = L.marker(drv, { zIndexOffset: 1000, icon: L.divIcon({ className: '',
        html: '<div class="mp-car"><svg class="mp-car-arrow" viewBox="0 0 24 24"><path d="M12 4 18 19 12 15.5 6 19Z" fill="#fff"/></svg></div>',
        iconSize: [36, 36], iconAnchor: [18, 18] }) }).addTo(map);
      else { turnCar(driverMk.getLatLng(), drv); glide(driverMk, drv); }
      if (trailLn) { map.removeLayer(trailLn); trailLn = null; }
      if (roadLn) { map.removeLayer(roadLn); roadLn = null; }
      if (o.trail && o.trail.length) trailLn = L.polyline([...o.trail, drv], { color: '#94a3b8', weight: 4, dashArray: '2 9', lineCap: 'round', interactive: false }).addTo(map);
      if (o.road && o.road.length > 1) roadLn = L.polyline(o.road, { className: 'mp-road', color: '#2563eb', weight: 6, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(map);
      const frame = (o.next ? 'n' : 'w') + o.id;
      if (!userMoved && frame !== lastFrame) {
        lastFrame = frame;
        map.fitBounds(L.latLngBounds([drv, dest]).pad(0.35), { maxZoom: 17 });
      }
    }
    function liveCard(o) {
      if (o.status === 'requested') {
        return `<div class="mp-live wait">
          <div class="mp-live-top"><span class="mp-dot amber"></span><b>${T.waiting}</b></div>
          ${o.note ? `<div class="mp-note">${esc(o.note)}</div>` : ''}
          <div class="mp-row"><a class="mp-btn ghost" href="${esc(o.track_url)}">${T.track}</a>
          <button class="mp-btn danger" type="button" onclick="cancelOrder('${esc(o.id)}')">${T.cancel}</button></div></div>`;
      }
      const m = o.eta_epoch ? Math.round((o.eta_epoch - Date.now() / 1000) / 60) : null;
      const big = o.arrived ? T.arrivedShort : (m === null ? '--' : (m <= 1 ? T.soon : T.mins(m)));
      const sub = o.arrived ? T.arrived : (o.next ? T.next : (o.stops_before !== null && o.stops_before !== undefined ? T.before(o.stops_before) : T.onWay));
      const seen = o.driver && o.driver_age_s > 60 ? `<div class="mp-seen">${T.lastSeen(Math.round(o.driver_age_s / 60))}</div>` : '';
      return `<div class="mp-live ${o.arrived ? 'here' : ''}">
        <div class="mp-live-top"><span class="mp-dot ${o.arrived ? 'green' : 'blue'}"></span><b>${T.onWay}</b>
          <span class="mp-at">${T.eta} ${esc(o.eta || '--')}</span></div>
        <div class="mp-big">${big}</div>
        <div class="mp-sub">${sub}</div>${seen}
        ${o.note ? `<div class="mp-note">${esc(o.note)}</div>` : ''}
        <a class="mp-btn" href="${esc(o.track_url)}">${T.track}</a></div>`;
    }
    async function loadLive() {
      let d;
      try { d = await (await fetch('/api/me/live')).json(); } catch (e) { return; }
      if (!d.ok) return;
      $('live').innerHTML = d.orders.map(liveCard).join('');
      drawLive(d.orders.find(o => o.status === 'pending') || null);
    }

    let lastOrders = [];
    async function loadOrders() {
      let d;
      try { d = await (await fetch('/api/me/orders')).json(); } catch (e) { return; }
      lastOrders = (d.ok && d.orders) || [];
      const past = lastOrders.filter(o => o.status === 'delivered' || o.status === 'cancelled');
      $('orders').innerHTML = past.map(o => `
        <div class="mp-item">
          <a class="mp-item-main" href="${esc(o.track_url)}">
            <div class="mp-item-name">${esc(o.note || '-')}</div>
            <div class="mp-time">${new Date(o.created_at * 1000).toLocaleString()}${o.price != null ? ' · ¥' + yuan(o.price) : ''}</div>
          </a>
          <div class="mp-item-side">
            ${o.has_trail ? `<button class="mp-chip small" type="button" onclick="showRoute('${esc(o.id)}')">${T.route}</button>` : ''}
            ${o.items && o.items.length ? `<button class="mp-chip small" type="button" onclick="orderAgain('${esc(o.id)}')">${T.again}</button>` : ''}
            <span class="mp-tag ${esc(o.status)}">${T.st[o.status] || esc(o.status)}</span>
          </div>
        </div>`).join('') || `<div class="mp-empty">${T.empty}</div>`;
      if (!pin && !myPos && lastOrders.length) setPin(lastOrders[0].lat, lastOrders[0].lng);
    }

    async function showRoute(id) {
      let d;
      try { d = await (await fetch(`/api/me/orders/${encodeURIComponent(id)}/trail`)).json(); } catch (e) { return; }
      [pastLn, pastHome].forEach(l => { if (l) map.removeLayer(l); });
      pastLn = pastHome = null;
      if (!d.ok || !d.trail.length) { alert(T.noRoute); return; }
      const dest = [d.lat, d.lng];
      pastLn = L.polyline([...d.trail, dest], { color: '#64748b', weight: 5, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(map);
      pastHome = L.circleMarker(dest, { radius: 7, color: '#fff', weight: 3, fillColor: '#16a34a', fillOpacity: 1, interactive: false }).addTo(map);
      userMoved = true;                                     // keep this view until "focus" is pressed
      map.fitBounds(pastLn.getBounds().pad(0.2), { maxZoom: 17 });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    const qty = {};
    let products = [], pin = null, shopInfo = { delivery_fee: 0, free_over: 0, min_order: 0 };
    function setPin(lat, lng) {
      if (pin) pin.setLatLng([lat, lng]);
      else pin = L.marker([lat, lng], { draggable: true }).addTo(map).bindTooltip(T.here, { permanent: true, direction: 'top', offset: [-15, -12] });
    }
    map.on('click', e => { if (!$('shop').hidden) setPin(e.latlng.lat, e.latlng.lng); });
    const feeFor = sub => shopInfo.free_over > 0 && sub >= shopInfo.free_over ? 0 : shopInfo.delivery_fee;
    function renderMenu() {
      $('menu').innerHTML = products.map(p => `
        <div class="mp-prod">
          <div><div class="mp-item-name">${esc(p.name)}</div><div class="mp-time">¥${yuan(p.price)}${p.unit ? ' / ' + esc(p.unit) : ''}</div></div>
          <div class="mp-qty"><button type="button" onclick="changeQty('${esc(p.id)}', -1)">-</button><span>${qty[p.id] || 0}</span>
          <button type="button" onclick="changeQty('${esc(p.id)}', 1)">+</button></div>
        </div>`).join('');
      const sub = products.reduce((s, p) => s + p.price * (qty[p.id] || 0), 0);
      const fee = sub > 0 ? feeFor(sub) : 0;
      $('total').textContent = T.total(yuan(Math.round((sub + fee) * 100) / 100));
      const parts = [];
      if (shopInfo.delivery_fee > 0) parts.push(fee > 0 ? T.fee(yuan(fee)) : T.feeFree);
      if (shopInfo.free_over > 0 && fee > 0) parts.push(T.freeOver(yuan(shopInfo.free_over)));
      if (shopInfo.min_order > 0 && sub < shopInfo.min_order) parts.push(T.minOrder(yuan(shopInfo.min_order)));
      $('fee-line').textContent = parts.join(' · ');
    }
    function changeQty(id, step) { qty[id] = Math.max(0, Math.min(99, (qty[id] || 0) + step)); renderMenu(); }
    async function loadMenu() {
      try {
        const res = await fetch('/api/products');
        if (!res.ok) return;
        products = await res.json();
        shopInfo = await (await fetch('/api/me/shop')).json();
      } catch (e) { return; }
      $('shop').hidden = !products.length;
      renderMenu();
    }
    $('place').onclick = async () => {
      const msg = $('order-msg');
      const fail = text => { msg.textContent = text; msg.className = 'mp-msg bad'; };
      const items = Object.entries(qty).filter(([, n]) => n > 0).map(([id, n]) => ({ id, qty: n }));
      const address = $('addr').value.trim();
      if (!items.length) return fail(T.needItems);
      const sub = products.reduce((s, p) => s + p.price * (qty[p.id] || 0), 0);
      if (shopInfo.min_order > 0 && sub < shopInfo.min_order) return fail(T.minOrder(yuan(shopInfo.min_order)));
      if (!pin) return fail(T.needPin);
      if (!address) return fail(T.needAddr);
      const at = pin.getLatLng();
      $('place').disabled = true;
      try {
        const res = await fetch('/api/me/order', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items, lat: at.lat, lng: at.lng, address }) });
        const d = await res.json();
        if (!d.ok) return fail(d.error || 'Error');
        try { localStorage.setItem('lastAddress', address); } catch (e) {}
        Object.keys(qty).forEach(k => delete qty[k]);
        renderMenu();
        msg.textContent = T.placed; msg.className = 'mp-msg ok';
        loadLive(); loadOrders();
      } finally { $('place').disabled = false; }
    };
    // AI: free text → cart + address. Only fills the form; the customer still checks and sends it.
    $('ai-read').onclick = async () => {
      const text = $('ai-text').value.trim(), msg = $('ai-msg');
      if (!text) return;
      const d = await (await fetch('/api/me/ai-order', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                        body: JSON.stringify({ text }) })).json();
      if (!d.ok) { msg.textContent = d.error || 'Error'; msg.className = 'mp-msg bad'; return; }
      const A = TEXTS[d.lang] || T;            // reply in the message's language (zh or en), not the page's
      const skipped = d.unmatched.length ? A.aiSkip(d.unmatched.join(', ')) : '';
      if (!d.items.length) { msg.textContent = A.aiNone + skipped; msg.className = 'mp-msg bad'; return; }
      Object.keys(qty).forEach(k => delete qty[k]);
      d.items.forEach(it => { qty[it.id] = it.qty; });
      if (d.address) $('addr').value = d.address;
      renderMenu();
      msg.textContent = A.aiGot(d.items.map(it => `${it.name} ×${it.qty}`).join(', ')) + skipped;
      msg.className = 'mp-msg ok';
    };
    function orderAgain(id) {
      const o = lastOrders.find(x => x.id === id);
      if (!o) return;
      Object.keys(qty).forEach(k => delete qty[k]);
      let missing = false;
      (o.items || []).forEach(it => {
        if (products.some(p => p.id === it.id)) qty[it.id] = Math.min(99, (qty[it.id] || 0) + it.qty);
        else missing = true;
      });
      renderMenu();
      setPin(o.lat, o.lng);
      const addr = (o.note || '').split(' | ')[0];
      if (addr) $('addr').value = addr;
      $('order-msg').textContent = missing ? T.againGone : '';
      $('order-msg').className = 'mp-msg bad';
      $('shop').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    async function cancelOrder(id) {
      if (!confirm(T.cancelAsk)) return;
      const d = await (await fetch(`/api/me/orders/${encodeURIComponent(id)}/cancel`, { method: 'POST' })).json();
      if (!d.ok) { alert(d.error || 'Error'); return; }
      loadLive(); loadOrders();
    }
    $('claim').onclick = async () => {
      const input = $('link'), msg = $('msg');
      const d = await (await fetch('/api/me/claim', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                     body: JSON.stringify({ link: input.value.trim() }) })).json();
      msg.textContent = d.ok ? T.added : T.bad;
      msg.className = 'mp-msg ' + (d.ok ? 'ok' : 'bad');
      if (d.ok) { input.value = ''; loadLive(); loadOrders(); }
    };

    loadMenu(); loadOrders(); loadLive();
    setInterval(() => { if (!document.hidden) loadLive(); }, 8000);
    setInterval(() => { if (!document.hidden) loadOrders(); }, 30000);
  </script>
</body>
</html>
