<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="google" content="notranslate"/>
  <meta charset="utf-8"/>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg?v={{ asset_v }}"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <meta name="theme-color" content="#1f5fd6"/>
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="智送管家"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <script src="/static/pwa.js?v={{ asset_v }}" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>我的订单 · 智送管家</title>
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css?v={{ asset_v }}"/>
  <link rel="stylesheet" href="/static/vendor/inter/inter.css?v={{ asset_v }}" media="print"/>
  <link rel="stylesheet" href="/static/pro.css?v={{ asset_v }}"/>
  <link rel="stylesheet" href="/static/css/me.css?v={{ asset_v }}"/>
  <link rel="stylesheet" href="/static/css/theme.css?v={{ asset_v }}"/>
</head>
<body class="app">
  <header class="me-top">
    <a class="me-brand" href="/me"><img src="/static/logo.svg?v={{ asset_v }}" alt=""/><span>智送管家</span></a>
    <div class="me-right">
      <span data-lang-slot></span>
      <form method="post" action="/logout"><button class="me-out" type="submit">Log out</button></form>
    </div>
  </header>

  <main class="me-wrap">
    <h1 id="hello"></h1>
    <div id="map" class="me-map"></div>

    <section class="me-card" id="shop" hidden>
      <h2 id="t-shop"></h2>
      <div id="menu" class="me-menu"></div>
      <p class="me-hint" id="t-where"></p>
      <input id="addr" class="me-input" maxlength="120" autocomplete="off"/>
      <div class="me-fee" id="fee-line"></div>
      <div class="me-total-row"><span id="total"></span><button id="place" class="me-place"></button></div>
      <div class="me-msg" id="order-msg"></div>
    </section>

    <section class="me-card">
      <h2 id="t-orders"></h2>
      <div id="orders" class="me-orders"></div>
    </section>

    <section class="me-card">
      <h2 id="t-add"></h2>
      <p class="me-hint" id="t-add-hint"></p>
      <div class="me-claim">
        <input id="link" placeholder="https://…/track/…" autocomplete="off"/>
        <button id="claim"></button>
      </div>
      <div class="me-msg" id="msg"></div>
    </section>
  </main>

  <script src="/static/vendor/leaflet/leaflet.js?v={{ asset_v }}"></script>
  <script src="/static/font-load.js?v={{ asset_v }}"></script>
  <script>
    const NAME = {{ name|tojson }};
    let lang = 'zh';
    try { lang = localStorage.getItem('lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en'); } catch (e) {}
    const T = {
      en: { hello: n => `Hi, ${n}`, orders: 'My orders', add: 'Add an order', btn: 'Add',
            hint: 'Got a tracking link from the shop? Paste it here to keep the order in your account.',
            empty: 'No orders yet. Paste a tracking link below to add one.',
            added: 'Order added', bad: 'This tracking link is not valid',
            shop: 'Order now', where: 'Tap the map to set where we deliver, then add your building and room.',
            addr: 'Building, floor, room (e.g. Bldg 5, room 302)', place: 'Place order', total: n => `Total ¥${n}`,
            needItems: 'Choose at least one product', needPin: 'Tap the map to set the delivery spot',
            needAddr: 'Add your building and room', placed: 'Order sent! The shop will confirm it soon.',
            cancel: 'Cancel', cancelAsk: 'Cancel this order?', here: 'Deliver here',
            again: 'Order again', againGone: 'Some products are not sold any more',
            fee: n => `Delivery ¥${n}`, feeFree: 'Free delivery', freeOver: n => `free over ¥${n}`,
            minOrder: n => `Minimum order ¥${n}`,
            st: { requested: 'Waiting for the shop', pending: 'On the way', delivered: 'Delivered', cancelled: 'Cancelled' } },
      zh: { hello: n => `您好，${n}`, orders: '我的订单', add: '添加订单', btn: '添加',
            hint: '收到商家发来的追踪链接？粘贴到这里，订单就会保存到您的账号。',
            empty: '还没有订单。在下面粘贴追踪链接即可添加。',
            added: '订单已添加', bad: '追踪链接无效',
            shop: '立即下单', where: '在地图上点一下送货位置，再填楼号和房间号～',
            addr: '楼号、楼层、房间（如 5号楼302）', place: '下单', total: n => `合计 ¥${n}`,
            needItems: '先选一件商品吧', needPin: '在地图上点一下送货位置', needAddr: '填一下楼号和房间号',
            placed: '下单成功！商家确认后马上配送～', cancel: '取消', cancelAsk: '确定取消这个订单吗？', here: '送到这里',
            again: '再来一单', againGone: '有些商品已下架啦',
            fee: n => `配送费 ¥${n}`, feeFree: '免配送费', freeOver: n => `满¥${n}免配送费`,
            minOrder: n => `起送价 ¥${n}`,
            st: { requested: '等商家确认', pending: '配送中', delivered: '已送达', cancelled: '已取消' } },
    }[lang === 'en' ? 'en' : 'zh'];

    function esc(t) {
      return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    document.getElementById('hello').textContent = T.hello(NAME);
    document.getElementById('t-orders').textContent = T.orders;
    document.getElementById('t-add').textContent = T.add;
    document.getElementById('t-add-hint').textContent = T.hint;
    document.getElementById('claim').textContent = T.btn;

    // Map: Gaode tiles (fast in China), centred on ZAFU until we know the orders
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([30.257, 119.727], 14);
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
                { subdomains: '1234', maxZoom: 18 }).addTo(map);
    const pins = L.layerGroup().addTo(map);
    const COLOR = { requested: '#f59e0b', pending: '#3b82f6', delivered: '#16a34a', cancelled: '#94a3b8' };
    const yuan = n => Number.isInteger(n) ? String(n) : n.toFixed(2);

    async function load() {
      const d = await (await fetch('/api/me/orders')).json();
      lastOrders = (d.ok && d.orders) || [];
      const list = document.getElementById('orders');
      pins.clearLayers();
      if (!d.ok || !d.orders.length) {
        list.innerHTML = `<div class="me-empty">${T.empty}</div>`;
        return;
      }
      list.innerHTML = d.orders.map(o => `
        <a class="me-order" href="${esc(o.track_url)}">
          <div><div class="me-note">${esc(o.note || '—')}</div>
            <div class="me-time">${new Date(o.created_at * 1000).toLocaleString()}${o.price != null ? ' · ¥' + yuan(o.price) : ''}</div></div>
          <div class="me-order-side">
            ${o.status === 'requested' ? `<button class="me-cancel" onclick="cancelOrder(event, '${esc(o.id)}')">${T.cancel}</button>` : ''}
            ${o.items && o.items.length && o.status !== 'requested' ? `<button class="me-again" onclick="orderAgain(event, '${esc(o.id)}')">${T.again}</button>` : ''}
            <span class="chip ${esc(o.status)}">${T.st[o.status] || esc(o.status)}</span>
          </div>
        </a>`).join('');
      const pts = d.orders.map(o => {
        L.circleMarker([o.lat, o.lng], { radius: 9, color: '#fff', weight: 2, fillColor: COLOR[o.status] || '#94a3b8', fillOpacity: 1 })
          .bindPopup(esc(o.note || T.st[o.status] || '')).addTo(pins);
        return [o.lat, o.lng];
      });
      map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
      if (!pin) setPin(d.orders[0].lat, d.orders[0].lng);   // same spot as last time, easy to move
    }

    // ---------- Order now: catalog, quantities, delivery spot ----------
    const qty = {};
    let lastOrders = [];
    let shopInfo = { delivery_fee: 0, free_over: 0, min_order: 0 };

    // Same rule as the server (settings.delivery_fee_for); the server has the final word.
    function feeFor(sub) { return shopInfo.free_over > 0 && sub >= shopInfo.free_over ? 0 : shopInfo.delivery_fee; }
    function feeText(sub, fee) {
      const parts = [];
      if (shopInfo.delivery_fee > 0) parts.push(fee > 0 ? T.fee(yuan(fee)) : T.feeFree);
      if (shopInfo.free_over > 0 && fee > 0) parts.push(T.freeOver(yuan(shopInfo.free_over)));
      if (shopInfo.min_order > 0 && sub < shopInfo.min_order) parts.push(T.minOrder(yuan(shopInfo.min_order)));
      return parts.join(' · ');
    }
    let products = [], pin = null;

    function setPin(lat, lng) {
      if (pin) pin.setLatLng([lat, lng]);
      else pin = L.marker([lat, lng], { draggable: true }).addTo(map).bindTooltip(T.here, { permanent: true, direction: 'top', offset: [-15, -12] });
    }
    map.on('click', e => setPin(e.latlng.lat, e.latlng.lng));

    function renderMenu() {
      document.getElementById('menu').innerHTML = products.map(p => `
        <div class="me-item">
          <div><div class="me-item-name">${esc(p.name)}</div>
            <div class="me-time">¥${yuan(p.price)}${p.unit ? ' / ' + esc(p.unit) : ''}</div></div>
          <div class="me-qty">
            <button onclick="changeQty('${esc(p.id)}', -1)" aria-label="-">−</button>
            <span>${qty[p.id] || 0}</span>
            <button onclick="changeQty('${esc(p.id)}', 1)" aria-label="+">+</button>
          </div>
        </div>`).join('');
      const sub = products.reduce((sum, p) => sum + p.price * (qty[p.id] || 0), 0);
      const fee = sub > 0 ? feeFor(sub) : 0;
      document.getElementById('total').textContent = T.total(yuan(Math.round((sub + fee) * 100) / 100));
      document.getElementById('fee-line').textContent = feeText(sub, fee);
    }
    function changeQty(id, step) {
      qty[id] = Math.max(0, Math.min(99, (qty[id] || 0) + step));
      renderMenu();
    }

    async function loadMenu() {
      const res = await fetch('/api/products');
      if (!res.ok) return;
      products = await res.json();
      try { shopInfo = await (await fetch('/api/me/shop')).json(); } catch (e) {}
      document.getElementById('shop').hidden = !products.length;   // nothing to sell: no shop box
      renderMenu();
    }

    document.getElementById('t-shop').textContent = T.shop;
    document.getElementById('t-where').textContent = T.where;
    document.getElementById('addr').placeholder = T.addr;
    document.getElementById('place').textContent = T.place;
    try { document.getElementById('addr').value = localStorage.getItem('lastAddress') || ''; } catch (e) {}

    document.getElementById('place').onclick = async () => {
      const msg = document.getElementById('order-msg');
      const items = Object.entries(qty).filter(([, n]) => n > 0).map(([id, n]) => ({ id, qty: n }));
      const address = document.getElementById('addr').value.trim();
      const fail = text => { msg.textContent = text; msg.className = 'me-msg bad'; };
      if (!items.length) return fail(T.needItems);
      const sub = products.reduce((s, p) => s + p.price * (qty[p.id] || 0), 0);
      if (shopInfo.min_order > 0 && sub < shopInfo.min_order) return fail(T.minOrder(yuan(shopInfo.min_order)));
      if (!pin) return fail(T.needPin);
      if (!address) return fail(T.needAddr);
      const at = pin.getLatLng();
      const btn = document.getElementById('place');
      btn.disabled = true;
      try {
        const res = await fetch('/api/me/order', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items, lat: at.lat, lng: at.lng, address }) });
        const d = await res.json();
        if (!d.ok) return fail(d.error || 'Error');
        try { localStorage.setItem('lastAddress', address); } catch (e) {}
        Object.keys(qty).forEach(k => delete qty[k]);
        renderMenu();
        msg.textContent = T.placed; msg.className = 'me-msg ok';
        load();
      } finally {
        btn.disabled = false;
      }
    };

    // Order again: same products, quantities, spot and address. The customer still
    // presses "Place order", so they always see today's prices first.
    function orderAgain(event, id) {
      event.preventDefault();                  // the button sits inside the order link
      event.stopPropagation();
      const o = lastOrders.find(x => x.id === id);
      if (!o) return;
      Object.keys(qty).forEach(k => delete qty[k]);
      let missing = false;
      o.items.forEach(it => {
        if (products.some(p => p.id === it.id)) qty[it.id] = Math.min(99, (qty[it.id] || 0) + it.qty);
        else missing = true;                   // hidden since then: skip it
      });
      renderMenu();
      setPin(o.lat, o.lng);
      const addr = (o.note || '').split(' | ')[0];
      if (addr) document.getElementById('addr').value = addr;
      const msg = document.getElementById('order-msg');
      msg.textContent = missing ? T.againGone : '';
      msg.className = 'me-msg bad';
      document.getElementById('shop').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function cancelOrder(event, id) {
      event.preventDefault();                  // the button sits inside the order link
      event.stopPropagation();
      if (!confirm(T.cancelAsk)) return;
      const res = await fetch(`/api/me/orders/${encodeURIComponent(id)}/cancel`, { method: 'POST' });
      const d = await res.json();
      if (!d.ok) { alert(d.error || 'Error'); return; }
      load();
    }

    // Add an order by its tracking link (the signed key proves it belongs to you)
    document.getElementById('claim').onclick = async () => {
      const input = document.getElementById('link'), msg = document.getElementById('msg');
      const res = await fetch('/api/me/claim', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                 body: JSON.stringify({ link: input.value.trim() }) });
      const d = await res.json();
      msg.textContent = d.ok ? T.added : T.bad;
      msg.className = 'me-msg ' + (d.ok ? 'ok' : 'bad');
      if (d.ok) { input.value = ''; load(); }
    };
    load();
    loadMenu();
    setInterval(() => { if (!document.hidden) load(); }, 20000);   // see when the shop confirms
  </script>
  <script src="/static/i18n.js?v={{ asset_v }}"></script>
  <script src="/static/pro.js?v={{ asset_v }}"></script>
  <script src="/static/app.js?v={{ asset_v }}"></script>
</body>
</html>
